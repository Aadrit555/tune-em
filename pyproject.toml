[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anydecision"
version = "0.2.0"
description = "A typed, uncertainty-aware decision runtime for open-weight LLMs extracting decisions directly from probability distributions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aadrit", email = "aadrit.yks@gmail.com" }
]
keywords = [
    "llm", "decision-engine", "calibration", "uncertainty-quantification",
    "selective-prediction", "conformal-prediction", "logits", "probability",
    "prompt-debiasing", "reproducibility"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "safetensors>=0.4.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
demo = [
    "gradio>=4.0.0",
]
vllm = [
    "vllm>=0.4.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "httpx>=0.25.0",
]
all = [
    "gradio>=4.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]

[project.scripts]
anydecision = "anydecision.cli.main:app"
tune-em = "anydecision.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["anydecision*", "tune_em*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"

